kind = "web"
previewPath = "/"
title = "Daksh Tooling Solutions"
version = "1.0.0"
id = "artifacts/daksh-tooling"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24266

[services.development]
run = "pnpm --filter @workspace/daksh-tooling run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daksh-tooling", "run", "build" ]
serve = "static"
publicDir = "artifacts/daksh-tooling/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24266"
BASE_PATH = "/"
